<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Modern Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>

  <!-- Dynamic / Animated Dynamic Aspect Elements (Background Telemetry Waves & Pulsing Nodes) -->
  <g opacity="0.25">
    <!-- Telemetry Pulse Wave Line 1 -->
    <path d="M 0 260 Q 150 200, 300 240 T 600 220 T 900 270 T 1200 210" fill="none" stroke="#06b6d4" stroke-width="3">
      <animate attributeName="d" 
               values="M 0 260 Q 150 200, 300 240 T 600 220 T 900 270 T 1200 210;
                       M 0 240 Q 150 260, 300 210 T 600 250 T 900 220 T 1200 250;
                       M 0 260 Q 150 200, 300 240 T 600 220 T 900 270 T 1200 210" 
               dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Telemetry Pulse Wave Line 2 (APM Spans Dynamic Flow) -->
    <path d="M 0 280 Q 200 320, 400 260 T 800 290 T 1200 240" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Background Decorative Glowing Spheres (Far behind text) -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="270" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitle Area (Clear Visibility Guaranteed) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Top Category Pill Tag -->
    <g transform="translate(0, -75)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="0" y="5" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">⚡ CURATED APM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome APM &amp; Observability
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Application Performance Monitoring • Distributed Tracing • OpenTelemetry • Real User Monitoring
    </text>

    <!-- Accent Indicator Bar -->
    <rect x="-60" y="80" width="120" height="4" rx="2" fill="url(#primaryGlow)"/>
  </g>

  <!-- Bottom Interactive Metric Pulse Bar (Foreground Footer Accent) -->
  <g transform="translate(600, 310)" text-anchor="middle" font-family="monospace" font-size="12" fill="#6b7280">
    <text x="-300" y="0">● TRACE METRICS</text>
    <text x="-100" y="0">● OPENTELEMETRY NATIVE</text>
    <text x="100" y="0">● PROFILING &amp; EBPF</text>
    <text x="300" y="0">● HIGH CARDINALITY</text>
  </g>
</svg>
